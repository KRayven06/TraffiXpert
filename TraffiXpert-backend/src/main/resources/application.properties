spring.application.name=TraffiXpert

# Database Configuration
# Default to H2 if no environment variables are set (Localhost)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:traffixpertdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# Server Port
server.port=${PORT:8080}

# CORS Configuration
# Default to localhost for dev, but allows comma-separated list from env var.
# For Render + Vercel deployment, you will set this env var to your Vercel URL.
# Example: CORS_ALLOWED_ORIGINS=https://traffixpert.vercel.app,http://localhost:3000
spring.mvc.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:9002}
