spring.application.name=TraffiXpert

# Database Configuration
# Default to H2 if no environment variables are set (Localhost)
# For Production, set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:traffixpertdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# Server Port (Render sets PORT env var automatically)
server.port=${PORT:8080}

# CORS Configuration (Allow frontend to connect)
# Update this with your actual frontend URL in production
management.endpoints.web.exposure.include=*
spring.mvc.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:9002}
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
